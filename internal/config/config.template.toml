# runpod-launcher configuration
# Recommended: chmod 600 ~/.config/runpod-launcher/config.toml

# RunPod API key (from runpod.io/console/user/settings → API Keys)
runpod_api_key = ""

# GPU type ID — verify from RunPod GPU list (e.g. "NVIDIA A100-SXM4-80GB", "NVIDIA H100 80GB HBM3")
gpu_type_id = "NVIDIA A100-SXM4-80GB"

# Minimum CUDA version required (e.g. "12.1", "12.9")
# RunPod will allocate a GPU with this CUDA version or newer
# Leave empty to accept any CUDA version
cuda_version = ""

# RunPod region (optional; e.g. "APAC", "EU", "US-EAST", "EU-NL")
# Leave empty to use RunPod's default region selection
region = ""

# Docker image for the pod
# Examples: "ollama/ollama:latest" or "vllm/vllm-openai:latest"
image_name = "ollama/ollama:latest"

# LLM model to serve (required)
# For Ollama: use format "modelname:tag" (e.g., "qwen3.6:27b", "mistral:latest")
#   Note: Ollama typically uses optimized quantization by default based on available VRAM
# For vLLM: use full model ID (e.g., "google/gemma-4-31b-it", "qwen/qwen3.5-9b")
model_name = "qwen3.6:27b"

# Container disk size in GB
container_disk_gb = 150

# Path inside the container where a volume is mounted
volume_mount_path = "/workspace"

# Maximum model context length in tokens (limits KV cache usage)
# Set this if the model's default context is too large for available GPU memory
# For example, Gemma 4 has a 262K context by default; set to 4096 or 8192 for smaller GPUs
# Leave at 0 to use the model's default
max_model_len = 0

# Ollama context window in tokens (OLLAMA_CONTEXT_LENGTH override)
# Set this to override the auto-detected context length for Ollama
# Examples:
#   - Set to 262144 (256K) for full context on high-end GPUs with optimization
#   - Set to 131072 (128K) for balanced performance on H100 with 8-bit quantization
#   - Set to 32768 (32K) for safe operation on medium GPUs (24-48 GiB VRAM)
#   - Set to 8192 for limited memory scenarios
# Leave at 0 to use auto-detection based on model name
# Auto-detection uses Ollama's official model specs: gemma4=262K, llama3.1=128K, mistral=32K, etc.
# NOTE: Larger context uses more VRAM; verify your GPU has sufficient memory
ollama_context_len = 131072

# Tool call parser for auto tool choice
# Enable automatic tool calling for models that support it
# For Qwen 3.x models: "qwen3_xml" or "qwen3_coder"
# For other models: "mistral", "internlm", "glm", "llama4_json", etc.
# Leave empty to disable tool calling
# See vLLM docs for full list of supported parsers
tool_call_parser = "qwen3_xml"

# Name used to identify the pod in RunPod
pod_name = "llm-launcher"

# Last generated vLLM API key (auto-populated after 'up' command)
# Used by 'model-status' and other commands to authenticate with the vLLM server
last_llm_api_key = ""

# Optional: path to OpenCode config JSON file for auto-update (e.g. ~/.config/opencode/config.json)
# Leave empty to skip auto-update
opencode_config_path = ""

# Optional: path to .env file for storing credentials (e.g. ~/.env)
# Leave empty to use ~/.env by default
env_file_path = ""

# Optional extra environment variables to inject into the pod
# [env_vars]
# MY_VAR = "value"

# Optional: override model specifications (e.g., VRAM requirements, context window)
# Primary source is Ollama API (when available); these overrides let you customize model specs
# Format: [model_specs_override.model_name] with min_vram_gb and context_window
# Example:
# [model_specs_override.qwen3_6_27b]
# min_vram_gb = 75
# context_window = 131072
# description = "Custom Qwen3.6 27B spec"
#
# Available models (with defaults):
# - qwen3.6:27b (70GB, 128K context)
# - qwen3.5:27b (55GB, 32K context)
# - gemma:4 (40GB, 256K context)
# - gemma2:27b (50GB, 8K context)
# - mistral:latest (20GB, 32K context)
# - llama3:70b (75GB, 8K context)
