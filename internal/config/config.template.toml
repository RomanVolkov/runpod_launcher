# runpod-launcher configuration
# Recommended: chmod 600 ~/.config/runpod-launcher/config.toml

# RunPod API key (from runpod.io/console/user/settings → API Keys)
runpod_api_key = ""

# GPU type ID — verify from RunPod GPU list (e.g. "AMPERE_16", "ADA_LOVELACE_24")
gpu_type_id = "AMPERE_16"

# Minimum CUDA version required (e.g. "12.1", "12.9")
# RunPod will allocate a GPU with this CUDA version or newer
# Leave empty to accept any CUDA version
cuda_version = ""

# RunPod region (optional; e.g. "APAC", "EU", "US-EAST", "EU-NL")
# Leave empty to use RunPod's default region selection
region = ""

# Docker image for the pod
# Examples: "ollama/ollama:latest" or "vllm/vllm-openai:latest"
image_name = "ollama/ollama:latest"

# LLM model to serve (required)
# For Ollama: use format "modelname:tag" (e.g., "gemma:4", "mistral:latest")
# For vLLM: use full model ID (e.g., "google/gemma-4-31b-it", "qwen/qwen3.5-9b")
model_name = ""

# Container disk size in GB
container_disk_gb = 50

# Path inside the container where a volume is mounted
volume_mount_path = "/workspace"

# Maximum model context length in tokens (limits KV cache usage)
# Set this if the model's default context is too large for available GPU memory
# For example, Gemma 4 has a 262K context by default; set to 4096 or 8192 for smaller GPUs
# Leave at 0 to use the model's default
max_model_len = 0

# Ollama context window in tokens (OLLAMA_CONTEXT_LENGTH override)
# Set this to override the auto-detected context length for Ollama
# Examples:
#   - Set to 262144 for full context on large GPUs (>= 48 GiB VRAM)
#   - Set to 32768 for safe operation on medium GPUs (24-48 GiB VRAM)
#   - Set to 8192 for limited memory scenarios
# Leave at 0 to use auto-detection based on model name
# Auto-detection uses Ollama's official model specs: gemma4=262K, llama3.1=128K, mistral=32K, etc.
# NOTE: Larger context uses more VRAM; verify your GPU has sufficient memory
ollama_context_len = 0

# Tool call parser for auto tool choice
# Enable automatic tool calling for models that support it
# For Qwen 3.x models: "qwen3_xml" or "qwen3_coder"
# For other models: "mistral", "internlm", "glm", "llama4_json", etc.
# Leave empty to disable tool calling
# See vLLM docs for full list of supported parsers
tool_call_parser = "qwen3_xml"

# Name used to identify the pod in RunPod
pod_name = "llm-launcher"

# Last generated vLLM API key (auto-populated after 'up' command)
# Used by 'model-status' and other commands to authenticate with the vLLM server
last_llm_api_key = ""

# Optional: path to OpenCode config JSON file for auto-update (e.g. ~/.config/opencode/config.json)
# Leave empty to skip auto-update
opencode_config_path = ""

# Optional: path to .env file for storing credentials (e.g. ~/.env)
# Leave empty to use ~/.env by default
# Used by serverless endpoint to securely store API keys
env_file_path = ""

# --- Serverless endpoint settings ---
# Docker image for the serverless worker (default: runpod/worker-vllm:stable-cuda12.1.0)
# Only used by 'serverless up' command
serverless_image_name = ""

# Name for the serverless endpoint in RunPod (default: llm-launcher-serverless)
# Only used by 'serverless up' and 'serverless down' commands
serverless_endpoint_name = ""

# Maximum number of concurrent workers for serverless endpoint (default: 3)
# Only used by 'serverless up' command
serverless_workers_max = 0

# GPU type for serverless endpoint (default: NVIDIA A100-SXM4-80GB)
# Must be compatible with CUDA 12.1 — RTX 5090 (Blackwell) is NOT compatible
# Use 'runpod-launcher availability' to see GPU IDs and pricing
# serverless_gpu_type_id = "NVIDIA A100-SXM4-80GB"

# Model name for serverless endpoint (HuggingFace format, e.g., "Qwen/Qwen3-32B")
# If set, overrides the pod's model_name for serverless deployment
# Ollama models use "modelname:tag" format for pods; vLLM serverless uses HuggingFace repo IDs
# Leave empty to use the pod's model_name field
serverless_model_name = ""

# vLLM-specific configuration for serverless endpoint (all optional)

# Maximum model context length in tokens (limits KV cache)
# Recommended values:
#   - Qwen3.5-27B on H100: 32000 (default is 128K, too large for batch processing)
#   - Llama2-70b on H100: 4096 (default is 4096)
#   - General: set 25-50% of model's default context for safe batch processing
# Leave at 0 to use the model's default
serverless_max_model_len = 0

# Model weight precision (bfloat16, float16, float32)
# bfloat16: 16-bit floating point with better numerical stability, good for most models
# float16:  faster but less stable, may cause precision issues on some models
# float32:  high quality but uses 2x VRAM, slower
# Default: bfloat16 (recommended balance of quality and memory)
serverless_dtype = ""

# GPU memory utilization ratio (0.0 to 1.0)
# Determines how much of the GPU's available VRAM is allocated for the model
# Example: 0.85 = use 85% of VRAM, reserve 15% for batch processing and overhead
# Recommended: 0.8-0.9 for large models on high-memory GPUs like H100
# Default: 0.85
serverless_gpu_memory_utilization = 0.0

# Optional extra environment variables to inject into the pod
# [env_vars]
# MY_VAR = "value"
